<!doctype html>
<html lang="en" class="theme-loading"><head><meta charset="utf-8"><title>Cordon snapshots</title>
<link rel="icon" type="image/png" sizes="32x32" href="../../icons/icon32.png">
<link rel="stylesheet" href="../shared/ui.css"></head>
<body><div class="page">
  <header>
    <div class="brand"><i class="i" data-icon="logo"></i><b>Cordon</b></div>
    <div class="head-right">
      <button id="openSettings" class="btn ghost icon-btn" title="Cordon settings"><i class="i" data-icon="sliders"></i></button>
      <span class="pill">Beta 1.0.7</span>
    </div>
  </header>
  <div><h1>Saved sessions</h1><p class="muted">Snapshots stay on this device. Restoring opens the tabs in new windows.</p></div>
  <div class="search">
    <i class="i search-ic" data-icon="search"></i>
    <input id="q" type="search" placeholder="Search by tab title or site">
    <button id="clearSearch" class="btn ghost icon-btn" hidden title="Clear search"><i class="i" data-icon="close"></i></button>
  </div>
  <div id="list" style="display:flex;flex-direction:column;gap:12px"></div>
</div>
<div id="toast" class="toast" hidden><span id="toastMsg"></span><button id="undo" class="btn">Undo</button></div>
<script type="module" src="recovery.js"></script></body></html>
