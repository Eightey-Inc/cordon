<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Cordon snapshots</title>
<link rel="icon" type="image/png" sizes="32x32" href="../../icons/icon32.png">
<link rel="stylesheet" href="../shared/ui.css"><style>
details.card summary { list-style:none; display:flex; align-items:center; gap:12px; padding:14px 16px; cursor:pointer; }
details.card summary::-webkit-details-marker { display:none; }
details[open] summary { border-bottom:1px solid var(--line); }
.tabs { padding:8px; display:flex; flex-direction:column; }
.tabs .w { padding:8px 8px 2px; }
.tab { display:flex; flex-direction:column; align-items:flex-start; text-align:left; padding:6px 8px; border:0; background:none; font:inherit; color:var(--fg); border-radius:8px; cursor:pointer; }
.tab:hover { background:var(--surface); } .tab span { max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.search { position:relative; }
.search .i { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--muted); }
.search input { width:100%; height:38px; padding:0 12px 0 36px; font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:9px; }
.toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); display:flex; align-items:center; gap:12px; padding:10px 10px 10px 16px; background:var(--fg); color:var(--bg); border-radius:10px; box-shadow:0 8px 24px rgba(0,0,0,.2); animation:fade-up .18s ease; z-index:50; }
.toast .btn { background:transparent; border-color:rgba(128,128,128,.4); color:inherit; }
.toast .btn:hover { background:rgba(128,128,128,.2); }
</style></head>
<body><div class="page">
  <header><div class="brand"><i class="i" data-icon="logo"></i><b>Cordon</b></div><span class="pill">Beta 1.0.6</span></header>
  <div><h1>Saved sessions</h1><p class="muted">Snapshots stay on this device. Restoring opens the tabs in new windows.</p></div>
  <div class="search"><i class="i" data-icon="search"></i><input id="q" type="search" placeholder="Search by tab title or site"></div>
  <div id="list" style="display:flex;flex-direction:column;gap:12px"></div>
</div>
<div id="toast" class="toast" hidden><span id="toastMsg"></span><button id="undo" class="btn">Undo</button></div>
<script type="module" src="recovery.js"></script></body></html>
